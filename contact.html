<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #F7F7F7; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(27,115,232,0.18); }
  </style>
</helmet>

<div style="color: #000000; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- ===== Top bar ===== -->
  <header data-screen-label="Top bar" style="position: sticky; top: 0; z-index: 50; background: #F7F7F7; border-bottom: 1px solid #ECECEC;">
    <div style="max-width: 1120px; margin: 0 auto; padding: 0 32px; height: 58px; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" style="display: flex; align-items: center; gap: 11px; text-decoration: none; color: #000000;">
        <img src="assets/sefro-icon-mono.png" alt="SEFRO" style="width: 26px; height: 26px; object-fit: contain;">
        <span style="font-weight: 700; font-size: 15px; letter-spacing: 0.22em;">SEFRO</span>
      </a>
      <nav style="display: flex; align-items: center; gap: 28px;">
        <a href="index.html#features" style="font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.7); text-decoration: none;" style-hover="color: #000000;">Features</a>
        <a href="about.html" style="font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.7); text-decoration: none;" style-hover="color: #000000;">About</a>
        <a href="index.html#download" style="font-size: 13.5px; font-weight: 600; color: #F7F7F7; background: #000000; text-decoration: none; padding: 7px 16px; border-radius: 999px;" style-hover="background: #222222;">Download</a>
      </nav>
    </div>
  </header>

  <!-- ===== Contact ===== -->
  <section data-screen-label="Contact" style="padding: 96px 32px 72px; flex: 1;">
    <div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; padding-left: 0.22em; text-transform: uppercase; color: rgba(0,0,0,0.38);">Contact</div>
      <h1 style="margin: 18px 0 0; font-size: clamp(38px, 5.5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800;">Say hello.</h1>
      <p style="margin: 34px 0 0; font-size: 17px; line-height: 1.65; color: rgba(0,0,0,0.68); font-weight: 500; text-wrap: pretty;">Questions, ideas, bugs, or you just want to talk sheets — email me and I’ll reply myself.</p>
      <a href="mailto:h.abinassif@gmail.com" style="margin-top: 36px; align-self: flex-start; display: inline-flex; align-items: center; background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 4px; padding: 22px 28px; box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 6px 16px rgba(0,0,0,0.05); text-decoration: none; color: #000000; font-size: clamp(17px, 2.6vw, 22px); font-weight: 700; letter-spacing: -0.01em; transition: transform 0.15s ease, box-shadow 0.15s ease;" style-hover="transform: translateY(-1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 12px 28px rgba(0,0,0,0.09); color: #1B73E8;">h.abinassif@gmail.com</a>
      <p style="margin: 26px 0 0; font-size: 14.5px; line-height: 1.6; color: rgba(0,0,0,0.5); font-weight: 500;">You can also use <strong style="font-weight: 700; color: rgba(0,0,0,0.65);">Send feedback</strong> inside the app — it reaches the same place.</p>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer data-screen-label="Footer" style="padding: 44px 32px 56px;">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
      <span style="font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.45);">© 2026 SEFRO</span>
      <div style="display: flex; align-items: center; gap: 24px;">
        <a href="privacy.html" style="font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.55); text-decoration: none;" style-hover="color: #000000;">Privacy policy</a>
        <a href="terms.html" style="font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.55); text-decoration: none;" style-hover="color: #000000;">Terms of use</a>
        <a href="contact.html" style="font-size: 13px; font-weight: 500; color: #000000; text-decoration: none;">Contact</a>
      </div>
    </div>
  </footer>

</div>
</x-dc>
</body>
</html>
